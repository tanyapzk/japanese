<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Японский — мои уроки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ===== THEMES ===== */
body{--chipink:#1f1d1a;
 --top:#ece7df;--time:#ffe68a;--place:#bff0e6;--obj:#ffcfd0;--verb:#cbdcff;--with:#ffd291;--q:#e5d2ff;--dir:#d4f2bf;--ga:#ffd0ea;--no:#cfe8ff;--mo:#e6f8b8;--kara:#ffdcc2;--ne:#f6d9ff;--ok:#16a34a;--bad:#e5484d}
body.t-sakura{--bg:linear-gradient(140deg,#ffe0ec 0%,#fff3df 45%,#e2efff 100%);--card:#fff;--ink:#1f1535;--mute:#7d7194;--line:#f3dbe6;--soft:#fff2f7;--accent:#ff3d7f;--accent2:#7b5cff;--bw:1px;--bc:rgba(255,61,127,.16);--sh:0 10px 30px rgba(255,61,127,.12);--hdr:rgba(255,255,255,.75);--r:20px;--title:Unbounded}
body.t-pop{--bg:#ffe84a radial-gradient(rgba(0,0,0,.09) 1.2px,transparent 1.3px) 0 0/14px 14px;--card:#fff;--ink:#111;--mute:#555;--line:#111;--soft:#fff7cc;--accent:#ff3b30;--accent2:#1d5cff;--bw:2.5px;--bc:#111;--sh:5px 5px 0 #111;--hdr:#fff;--r:14px;--title:Unbounded}
body.t-neon{--bg:radial-gradient(1200px 600px at 10% -10%,#3a1f7a 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#0f4c6e 0%,transparent 60%),#120d26;--card:#1d1740;--ink:#f3eeff;--mute:#a79fd0;--line:#2f2760;--soft:#2a2258;--accent:#ff2fa8;--accent2:#22e1ff;--bw:1px;--bc:rgba(34,225,255,.18);--sh:0 0 0 1px rgba(255,47,168,.10),0 14px 34px rgba(0,0,0,.45);--hdr:rgba(18,13,38,.82);--r:18px;--title:Unbounded}
body.t-matcha{--bg:linear-gradient(160deg,#dcf7e3 0%,#f6fbe2 55%,#fff0dc 100%);--card:#fff;--ink:#163126;--mute:#5f7a6c;--line:#d8eadf;--soft:#effaf2;--accent:#10a36d;--accent2:#ff7a2f;--bw:1px;--bc:rgba(16,163,109,.18);--sh:0 10px 26px rgba(16,163,109,.12);--hdr:rgba(255,255,255,.78);--r:22px;--title:Unbounded}

*{box-sizing:border-box}
html{background:#fff}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:Manrope,"Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5}
.jp{font-family:"Noto Sans JP",system-ui,sans-serif}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:var(--bw) solid var(--bc)}
.bar{max-width:1060px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--title),Manrope,sans-serif;font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.stamp{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:"Noto Sans JP";font-weight:900;border-radius:10px;padding:3px 9px;font-size:17px}
body.t-pop .stamp{border:2.5px solid #111;box-shadow:3px 3px 0 #111}
.toggles{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tg{border:var(--bw) solid var(--bc);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--mute)}
.tg.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sw{display:flex;gap:6px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);cursor:pointer;box-shadow:0 0 0 1px var(--bc)}
.sw button.on{box-shadow:0 0 0 3px var(--accent)}
nav{max-width:1060px;margin:0 auto;padding:10px 12px 10px;display:flex;gap:6px;overflow-x:auto}
nav a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap;font-size:15px}
nav a.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
body.t-pop nav a.on{border:2px solid #111;box-shadow:3px 3px 0 #111}
main{max-width:1060px;margin:0 auto;padding:22px 18px 90px}
section{display:none}section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-family:var(--title),Manrope,sans-serif;font-size:28px;margin:4px 0 6px;letter-spacing:-.01em}
h3{font-size:19px;margin:28px 0 12px}
.lead{color:var(--mute);margin:0 0 18px;max-width:760px}
.card{background:var(--card);border:var(--bw) solid var(--bc);box-shadow:var(--sh);border-radius:var(--r);padding:18px 20px;margin:0 0 16px}
.rj{display:block;color:var(--mute);font-size:13px;font-family:Manrope,system-ui,sans-serif;letter-spacing:.01em}
body.norj .rj{display:none}
body.noru .ru{visibility:hidden}
.small{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
body.t-pop td,body.t-pop th{border-bottom:1.5px solid #111}
th{font-size:13px;color:var(--mute);font-weight:700}
.chip{display:inline-block;border-radius:8px;padding:1px 7px;margin:1px 1px;color:var(--chipink)}
.c-top{background:var(--top)}.c-time{background:var(--time)}.c-place{background:var(--place)}.c-obj{background:var(--obj)}.c-verb{background:var(--verb)}.c-with{background:var(--with)}.c-q{background:var(--q)}.c-dir{background:var(--dir)}.c-ga{background:var(--ga)}.c-no{background:var(--no)}.c-mo{background:var(--mo)}.c-kara{background:var(--kara)}.c-ne{background:var(--ne)}
.pp{font-weight:900;color:#d6262f}
.hint{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:10px}
body.t-pop .hint{border:2px solid #111}
.warn{background:#fff1e6;color:#1f1d1a;border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:10px;border-left:5px solid #ff8a3d}
.flag{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:800;margin-left:4px}

/* home */
.hero{border-radius:calc(var(--r) + 6px);padding:26px 26px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));position:relative;overflow:hidden;margin-bottom:22px;border:var(--bw) solid var(--bc);box-shadow:var(--sh)}
.hero h1{font-family:var(--title),Manrope,sans-serif;font-size:32px;margin:0 0 6px;line-height:1.15}
.hero p{margin:0;opacity:.92;max-width:600px}
.hero .big-kana{position:absolute;right:-10px;bottom:-40px;font-size:180px;font-family:"Noto Sans JP";font-weight:900;opacity:.16;line-height:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(255,255,255,.2);border-radius:14px;padding:8px 14px;font-weight:700}
.stat b{font-size:22px;display:block;line-height:1.1}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.th{border-radius:16px;padding:14px;cursor:pointer;border:3px solid transparent;font:inherit;text-align:left;color:#1f1d1a}
.th.on{border-color:var(--ink)}
.th b{display:block;font-size:16px}.th span{font-size:13px;opacity:.85}
.th .dots{display:flex;gap:5px;margin-top:10px}.th .dots i{width:18px;height:18px;border-radius:50%;display:block}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:block;text-decoration:none;color:#fff;border-radius:var(--r);padding:18px 18px 16px;position:relative;overflow:hidden;min-height:150px;border:var(--bw) solid var(--bc);box-shadow:var(--sh);transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-.4deg)}
.tile .em{font-size:38px;line-height:1}
.tile .tt{font-weight:800;font-size:18px;margin-top:10px;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.tile .ts{font-size:13px;opacity:.92;margin-top:4px}
.tile .prog{height:6px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:12px;overflow:hidden}
.tile .prog i{display:block;height:100%;background:#fff;border-radius:9px}
.tile .bk{position:absolute;right:8px;top:4px;font-size:64px;font-family:"Noto Sans JP";font-weight:900;opacity:.18}

/* topic page */
.banner{border-radius:calc(var(--r) + 4px);padding:22px 24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;border:var(--bw) solid var(--bc);box-shadow:var(--sh)}
.banner .em{font-size:46px;line-height:1}
.banner h2{color:#fff;margin:8px 0 4px}
.banner p{margin:0;opacity:.93}
.back{display:inline-block;margin-bottom:12px;font-weight:700;text-decoration:none;color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager a{text-decoration:none;font-weight:700;background:var(--card);border:var(--bw) solid var(--bc);box-shadow:var(--sh);padding:10px 16px;border-radius:999px;color:var(--ink)}
.exl{display:grid;gap:10px}
.ex{background:var(--card);border:var(--bw) solid var(--bc);border-radius:16px;padding:12px 16px;box-shadow:var(--sh)}
.ex .j{font-size:20px;font-family:"Noto Sans JP"}
.sent{font-size:20px;line-height:2}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.word{background:var(--card);border:var(--bw) solid var(--bc);border-radius:16px;padding:12px 14px;cursor:pointer;position:relative;box-shadow:var(--sh)}
.word .k{font-size:22px;font-family:"Noto Sans JP";font-weight:500;line-height:1.3}
.word .m{font-weight:700;margin-top:4px}
.word .n{font-size:12.5px;color:var(--mute);margin-top:3px}
.word .tp{font-size:11px;font-weight:800;color:var(--accent);margin-top:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.cols2,.cols3{grid-template-columns:1fr}.hero h1{font-size:26px}}
.big{font-size:30px;font-family:"Noto Sans JP";font-weight:700}
.zone{border-radius:16px;padding:14px;text-align:center;color:#1f1d1a}
.zone .big{display:block}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini>div{background:var(--card);border:var(--bw) solid var(--bc);border-radius:12px;padding:8px 10px;text-align:center}
.mini .j{font-size:19px;font-family:"Noto Sans JP"}
.mini .x{background:#ffe9e0;color:#1f1d1a}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:720px){.wk{grid-template-columns:repeat(4,1fr)}}
.wk>div{border-radius:14px;padding:10px 6px;text-align:center;color:#1f1d1a}
.wk .kj{font-size:30px;font-family:"Noto Sans JP";font-weight:900;line-height:1.1}
.wk .e{font-size:20px}
.wk .j{font-family:"Noto Sans JP";font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;background:var(--card);border:var(--bw) solid var(--bc);box-shadow:var(--sh)}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.bub.me .rj,.bub.me .small{color:rgba(255,255,255,.85)}
.bub .who{font-size:12px;font-weight:800;opacity:.75}
.bub .j{font-family:"Noto Sans JP";font-size:18px}
.gap{display:inline-block;min-width:90px;border-bottom:3px dashed currentColor}
details.ans summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:6px}
.grid2{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;max-width:560px}
.grid2>div{padding:12px;border-radius:12px;text-align:center;background:var(--card);border:var(--bw) solid var(--bc)}
.grid2 .h{background:transparent;border:none;color:var(--mute);font-size:14px;font-weight:700;align-self:center}
.grid2 .f{font-size:20px;font-family:"Noto Sans JP"}
.vt td{font-size:17px}.vt .rj{font-size:12px}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:10px 0}
.order .slot{border-radius:14px;padding:10px 12px;min-width:96px;text-align:center;color:#1f1d1a}
.order .slot b{display:block;font-size:12px;color:#4b463f}
.order .arrow{align-self:center;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--card);border:var(--bw) solid var(--bc);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.pcard .bigp{font-size:42px;font-family:"Noto Sans JP";font-weight:900;line-height:1;display:flex;align-items:center;gap:10px}
.pcard .bigp small{font-family:Manrope,system-ui,sans-serif;font-size:16px;color:var(--mute);font-weight:700}
.pcard .use{margin-top:12px}
.pcard .use b{display:block}
.newb{font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:middle}
.kana{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:540px}
.kana>div{background:var(--card);border:var(--bw) solid var(--bc);border-radius:12px;text-align:center;padding:8px 0;min-height:62px}
.kana>div.e{background:transparent;border:none}
.kana .kc{font-size:26px;font-family:"Noto Sans JP";line-height:1.2}
.kana .kr{font-size:12px;color:var(--mute)}
.kana.y{grid-template-columns:repeat(3,1fr);max-width:330px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.pill{border:var(--bw) solid var(--bc);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer;font-weight:600}
.pill.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
body.t-pop .pill.on{border:2.5px solid #111}
.search{width:100%;max-width:420px;padding:11px 16px;border-radius:999px;border:var(--bw) solid var(--bc);background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin-bottom:12px;box-shadow:var(--sh)}
.stage{background:var(--card);border:var(--bw) solid var(--bc);box-shadow:var(--sh);border-radius:calc(var(--r) + 4px);padding:24px;min-height:320px}
.flash{border:2px dashed var(--line);border-radius:20px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:18px;user-select:none;background:var(--soft)}
.flash .front{font-size:42px;font-family:"Noto Sans JP";font-weight:500}
.flash .front.rus{font-size:28px;font-family:Manrope,system-ui,sans-serif;font-weight:800}
.flash .back{margin-top:12px;font-size:20px}
.flash .tap{color:var(--mute);font-size:13px;margin-top:14px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.good{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
body.t-pop .btn{border:2.5px solid #111;box-shadow:3px 3px 0 #111}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.q{font-size:26px;font-family:"Noto Sans JP";text-align:center;margin:10px 0 6px;line-height:1.7}
.q .blank{display:inline-block;min-width:44px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:800}
.qru{text-align:center;color:var(--mute);margin-bottom:16px}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:21px;font-family:"Noto Sans JP";cursor:pointer;min-width:60px}
.opt small{display:block;font-family:Manrope,system-ui,sans-serif;font-size:12px;color:var(--mute)}
.opt.right{border-color:var(--ok);background:#e6f7ec;color:#1f1d1a}.opt.wrong{border-color:var(--bad);background:#fde9ea;color:#1f1d1a}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:15px;display:none;color:#1f1d1a}
.fb.show{display:block}.fb.ok{background:#e6f7ec}.fb.no{background:#fde9ea}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.wt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:20px;font-family:"Noto Sans JP";cursor:pointer}
.wt .rj{font-size:11px}
.answer{border:2px dashed var(--line);border-radius:16px;min-height:64px;padding:8px;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.answer:empty::before{content:attr(data-ph);color:var(--mute);font-size:14px}
label.ck{font-size:14px;color:var(--mute);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.clock{font-family:Unbounded,Manrope,sans-serif;font-size:64px;font-weight:800;text-align:center;letter-spacing:.02em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* ===== new ===== */
body.notr .tr{visibility:hidden}
.lang{display:flex;border:var(--bw) solid var(--bc);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:800;padding:5px 11px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:var(--card)}
nav a .n{font-size:12px;opacity:.6;margin-right:5px}
.subnav{position:sticky;top:var(--hh,104px);z-index:10;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;margin:0 0 16px;background:var(--hdr);backdrop-filter:blur(10px);border:var(--bw) solid var(--bc);border-radius:999px;box-shadow:var(--sh)}
.subnav a{padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap;font-size:14px;background:var(--soft)}
.subnav a.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.blk{scroll-margin-top:calc(var(--hh,104px) + 70px)}
.blk>h3:first-child{margin-top:8px}
.tile .no{font-family:Unbounded,Manrope,sans-serif;font-size:30px;font-weight:800;line-height:1;opacity:.95}
.tile .tt{margin-top:12px}
.tile.sm{min-height:110px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pair .ex.q{background:var(--soft)}
@media(max-width:720px){.pair{grid-template-columns:1fr}}
.wtab td{vertical-align:middle}
.wtab .k{font-family:"Noto Sans JP";font-size:20px}
.wtab .nt{font-size:12.5px;color:var(--mute)}
.applink{display:flex;gap:16px;align-items:center;flex-wrap:wrap;text-decoration:none;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));border-radius:var(--r);padding:16px 20px;margin:0 0 18px;box-shadow:var(--sh);border:var(--bw) solid var(--bc)}
.applink b{font-size:18px;display:block}
.applink span{opacity:.9;font-size:14px}
.applink .go{margin-left:auto;background:rgba(255,255,255,.22);border-radius:999px;padding:8px 16px;font-weight:800;white-space:nowrap}
.applink svg{flex:none}
.nm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.nm>div{background:var(--card);border:var(--bw) solid var(--bc);border-radius:12px;padding:8px 10px;text-align:center}
.nm .d{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:15px;color:var(--accent)}
.nm .j{font-family:"Noto Sans JP";font-size:18px;line-height:1.35}
.nm .x{background:#ffe9e0;color:#1f1d1a}
.nm .x .rj{color:#6b5f57}
.bad-ex{background:#fde9ea;color:#1f1d1a;border-radius:12px;padding:8px 12px;margin-top:8px}
.good-ex{background:#e6f7ec;color:#1f1d1a;border-radius:12px;padding:8px 12px;margin-top:8px}
.bad-ex .rj,.good-ex .rj{color:#5d5560}
.excl{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:800;margin-left:4px;vertical-align:middle}

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LANG=store.get('lang','ru');
const T=(ru,en)=>LANG==='en'?en:ru;
const rj=t=>t?`<span class="rj">${t}</span>`:'';
const tr=(ru,en)=>{const t=T(ru,en);return t?`<span class="small tr" style="display:block">${t}</span>`:''};
const col=s=>s.split(' ').map(w=>{const i=w.lastIndexOf(':');if(i<0)return w;return `<span class="chip c-${w.slice(i+1)}">${w.slice(0,i)}</span>`}).join(' ');
const S=x=>`<div class="ex${x[4]?' '+x[4]:''}"><div class="j">${x[0]}</div>${rj(x[1])}${tr(x[2],x[3])}</div>`;
const SL=a=>`<div class="exl">${a.map(S).join('')}</div>`;
const PAIRS=a=>a.map(([q,ans])=>`<div class="pair">${S(q.concat(['q']))}${S(ans)}</div>`).join('');
const card=(h,b)=>`<div class="card">${h?`<h3 style="margin-top:0">${h}</h3>`:''}${b}</div>`;
const hint=(ru,en)=>`<div class="hint">${T(ru,en)}</div>`;
const mini=a=>`<div class="mini">${a.map(x=>`<div class="${x[4]||''}"><div class="j">${x[0]}</div>${rj(x[1])}${T(x[2],x[3])?`<div class="small">${T(x[2],x[3])}</div>`:''}</div>`).join('')}</div>`;
/* number grid: [label, kana, romaji, cls] */
const NM=a=>`<div class="nm">${a.map(x=>`<div class="${x[3]||''}"><div class="d">${x[0]}</div><div class="j">${x[1]}</div>${rj(x[2])}</div>`).join('')}</div>`;
const bub=(me,who,j,r,ru,en)=>`<div class="bub ${me?'me':''}"><div class="who">${who}</div><div class="j">${j}</div>${rj(r)}${tr(ru,en)}</div>`;
const EX=`<span class="excl">!</span>`;
const goodEx=(j,r,ru,en)=>`<div class="good-ex"><span class="jp">${j}</span>${rj(r)}${tr(ru,en)}</div>`;
const badEx=(j,r,ru,en)=>`<div class="bad-ex"><span class="jp"><s>${j}</s></span>${rj(r)}${tr(ru,en)}</div>`;
/* words table: "jp|romaji|ru|en|noteRu|noteEn" */
const parseW=s=>s.trim().split('\n').map(l=>{const [k,r,ru,en,nr,ne]=l.split('|');return{k,r,ru,en,nr:nr||'',ne:ne||nr||''}});
const WT=list=>`<div class="card" style="padding:6px 14px;overflow-x:auto"><table class="wtab">${list.map(w=>`<tr><td class="k">${w.k}${rj(w.r)}</td><td><b class="tr">${T(w.ru,w.en)}</b>${T(w.nr,w.ne)?`<div class="nt">${T(w.nr,w.ne)}</div>`:''}</td></tr>`).join('')}</table></div>`;
const WORDS_APP='https://tanyapzk.github.io/vocabulary-app/tanya-ja/?u=tanya-ja-96c5a030';
const appLink=()=>`<a class="applink" href="${WORDS_APP}" target="_blank" rel="noopener"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="16" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v14"/><path d="M7 10h6M7 14h4"/></svg><div><b>${T('Учить слова — в моём приложении','Learn the words in my vocabulary app')}</b><span>${T('Карточки, тесты и прогресс там. Здесь списки только для справки.','Flashcards, quizzes and progress live there. The lists here are just for reference.')}</span></div><span class="go">${T('Открыть','Open')} →</span></a>`;

/* ================= 1. PHRASES ================= */
const SEC_PHRASES={id:'phrases',n:1,k:'話',c:['#ff4f8b','#ffa45c'],t:['Фразы','Phrases'],sub:['Знакомство, вежливые реакции, фразы для урока, «нравится» и вопросительные слова.','Introductions, polite reactions, classroom phrases, “I like” and question words.'],blocks:[
{id:'intro',t:['Знакомство','Introductions'],h:()=>card('',S(['はじめまして。','hajimemashite','Приятно познакомиться. (первая фраза при знакомстве)','Nice to meet you. (the first thing you say when you meet)'])+'<div style="height:10px"></div>'+PAIRS([
 [['なまえは なんですか。','namae wa nan desu ka','Как тебя зовут?','What is your name?'],['わたしは ターニャです。','watashi wa Taanya desu','Я — Таня.','I am Tanya.']],
 [['どこから きましたか。','doko kara kimashita ka','Откуда ты?','Where are you from?'],['ロシアから きました。','Roshia kara kimashita','Я из России. (дословно: «приехала из России»)','I’m from Russia. (literally: “I came from Russia”)']],
 [['しごとは なんですか。','shigoto wa nan desu ka','Кем ты работаешь?','What is your job?'],['えいごの せんせいです。','eigo no sensei desu','Я учитель английского.','I am an English teacher.']],
 [['しゅみは なんですか。','shumi wa nan desu ka','Какое у тебя хобби?','What is your hobby?'],['しゅみは どくしょです。','shumi wa dokusho desu','Моё хобби — чтение.','My hobby is reading.']],
 [['あなたは？','anata wa?','А ты?','How about you?'],['いぬを かっています。','inu o katte imasu','У меня есть собака. (дословно: «держу собаку»)','I have a dog. (literally: “I keep a dog”)']],
])+S(['おあいできて うれしいです。','oai dekite ureshii desu','Рада с вами познакомиться.','Nice to meet you. / I’m happy to meet you.'])
+hint('<b>から</b> = «из, от»: ロシア<b>から</b>. <b>の</b> = «чей / какой»: えいご<b>の</b> せんせい — учитель (чего?) английского. Слева вопрос, справа ответ.','<b>から</b> = “from”: ロシア<b>から</b>. <b>の</b> links two nouns: えいご<b>の</b> せんせい — a teacher of English. Questions on the left, answers on the right.'))},
{id:'react',t:['Реакции и вежливость','Reactions & politeness'],h:()=>card('',`<div class="cols3">${[
 ['そうですか。','sou desu ka','Вот как. / Понятно.','I see.'],['わかりました。','wakarimashita','Поняла.','I understand. / Got it.'],['わたしもです。','watashi mo desu','Я тоже.','Me too.'],
 ['どうも！','doumo','Спасибо!','Thanks! / Thanks a lot!'],['どういたしまして。','dou itashimashite','Не за что. / Пожалуйста.','You’re welcome.'],['いいですね。','ii desu ne','Здорово! Звучит хорошо.','Sounds good! / Nice!'],
 ['ばいばい！','baibai','Пока!','Bye!'],['じゃあね！','jaa ne','Ну, пока! Увидимся!','See you!'],['またね！','mata ne','До встречи!','See you later!'],
 ['すみません。','sumimasen','Извините. (чтобы обратиться)','Excuse me.'],['はい','hai','Да','Yes'],['いいえ','iie','Нет','No'],
].map(S).join('')}</div>`+hint('ばいばい и じゃあね — для друзей. С учителем или незнакомыми лучше сказать <span class="jp">しつれいします</span> (shitsurei shimasu, «до свидания», буквально «извините, что ухожу»). Добавлено мной.','ばいばい and じゃあね are for friends. With a teacher or strangers say <span class="jp">しつれいします</span> (shitsurei shimasu, “goodbye”, literally “excuse me for leaving”). Added by me.'))},
{id:'class',t:['Фразы для урока','Classroom phrases'],h:()=>card(T('Говорить на уроке вместо английского','Use these in class instead of English'),`<div class="cols2">${[
 ['わかりません。','wakarimasen','Не понимаю.','I don’t understand.'],['もういちど おねがいします。','mou ichido onegai shimasu','Ещё раз, пожалуйста.','One more time, please.'],
 ['ゆっくり おねがいします。','yukkuri onegai shimasu','Помедленнее, пожалуйста.','Slowly, please.'],['これは なんですか？','kore wa nan desu ka','Что это?','What is this?'],
 ['どういう いみですか？','dou iu imi desu ka','Что это значит?','What does it mean?'],['にほんごで なんですか？','nihongo de nan desu ka','Как это по-японски?','How do you say it in Japanese?'],
 ['あっていますか？','atte imasu ka','Правильно?','Is this correct?'],['しりません。','shirimasen','Не знаю.','I don’t know.'],
].map(S).join('')}</div>`+hint('<b>おねがいします</b> («пожалуйста, прошу») — очень полезное слово: им можно попросить что угодно. もういちど <b>おねがいします</b>, カードで <b>おねがいします</b>.','<b>おねがいします</b> (“please”) is a very handy word: you can ask for anything with it. もういちど <b>おねがいします</b>, カードで <b>おねがいします</b>.'))
 +card(T('Как это звучит','How it sounds'),T('Сайт, где можно послушать любое слово в настоящих видео: ','A site where you can hear any word in real videos: ')+`<a href="https://youglish.com/japanese" target="_blank" rel="noopener">youglish.com/japanese</a>. `+T('Вводишь, например, <span class="jp">わかりました</span> и слушаешь, как его говорят японцы.','Type, for example, <span class="jp">わかりました</span> and listen to Japanese people say it.'))},
{id:'like',t:['Нравится / не нравится','Likes & dislikes'],h:()=>card('',`<div class="sent jp">${col('〇〇が:ga すきです:verb')}</div>${rj('〇〇 ga suki desu')}${tr('Мне нравится 〇〇. / Я люблю 〇〇.','I like 〇〇.')}
 <div class="sent jp" style="margin-top:8px">${col('〇〇が:ga すきじゃないです:verb')}</div>${rj('〇〇 ga suki ja nai desu')}${tr('Мне не нравится 〇〇. / Я не люблю 〇〇.','I don’t like 〇〇.')}
 <div style="height:12px"></div>`+SL([
 ['コーヒーか おちゃ、どっちが すきですか？','koohii ka ocha, dotchi ga suki desu ka','Кофе или чай — что ты больше любишь?','Coffee or tea — which do you like more?'],
 ['〇〇の ほうが すきです。','〇〇 no hou ga suki desu','Больше люблю 〇〇.','I prefer 〇〇. / I like 〇〇 more.'],
 ['はると あきが すきです。','haru to aki ga suki desu','Я люблю весну и осень.','I like spring and autumn.'],
 ['すきな たべものは なんですか？','suki na tabemono wa nan desu ka','Какая твоя любимая еда?','What is your favourite food?'],
])+hint('После すき ставится <b>が</b>, а не を: コーヒー<b>が</b> すきです. <b>か</b> между словами значит «или»: コーヒー<b>か</b> おちゃ. <b>ほう</b> — «сторона»: 〇〇の ほうが = «〇〇 больше».','After すき use <b>が</b>, not を: コーヒー<b>が</b> すきです. <b>か</b> between nouns means “or”: コーヒー<b>か</b> おちゃ. <b>ほう</b> means “side”: 〇〇の ほうが = “〇〇 more”.')
 +hint('«Люблю что-то <b>делать</b>»: словарная форма глагола + のが すきです. Подробно — в <a href="#grammar/verbs">Грамматике</a>.','“I like <b>doing</b> something”: dictionary form + のが すきです. More in <a href="#grammar/verbs">Grammar</a>.'))},
{id:'qwords',t:['Вопросительные слова','Question words'],h:()=>card('',`<div class="cols2">${[
 ['なんですか？（何ですか）','nan desu ka','Что это? Какой?','What is it?'],['だれですか？（誰ですか）','dare desu ka','Кто это?','Who is it?'],
 ['どこですか？','doko desu ka','Где?','Where is it?'],['いつですか？','itsu desu ka','Когда?','When is it?'],
 ['なぜですか？','naze desu ka','Почему?','Why?'],['どうですか？','dou desu ka','Как? Как тебе?','How is it?'],
 ['いくらですか？','ikura desu ka','Сколько стоит?','How much is it?'],['なんじですか？','nanji desu ka','Который час?','What time is it?'],
 ['なんようびですか？','nan’youbi desu ka','Какой день недели?','What day is it?'],['なんさいですか？','nansai desu ka','Сколько лет?','How old are you?'],
].map(S).join('')}</div>`+hint('Вопросительное слово стоит на <b>месте ответа</b>: <span class="jp">やすみは <b>きんようび</b>です</span> → <span class="jp">やすみは <b>なんようび</b>ですか？</span> Порядок слов не меняется, в конце добавляется か.','The question word goes <b>where the answer would be</b>: <span class="jp">やすみは <b>きんようび</b>です</span> → <span class="jp">やすみは <b>なんようび</b>ですか？</span> Word order stays the same, just add か at the end.'))},
]};

function minRead(m,bad){if(m===0)return['',''];const t=Math.floor(m/10),u=m%10;const U=bad?UMBAD:UM;
 if(u===0)return bad?[TENS[t][0]+'ふん',TENS[t][1]+'fun']:TENX[t];return[TENS[t][0]+U[u][0],TENS[t][1]+U[u][1]]}

function numRead(n,naive){const man=Math.floor(n/10000),th=Math.floor(n/1000)%10,hu=Math.floor(n/100)%10,te=Math.floor(n/10)%10,un=n%10;let k=[],r=[];

 if(hu){const s=naive?null:{1:['ひゃく','hyaku'],3:['さんびゃく','sanbyaku'],6:['ろっぴゃく','roppyaku'],8:['はっぴゃく','happyaku']}[hu];const x=s||(hu===1?['ひゃく','hyaku']:[D[hu][0]+'ひゃく',D[hu][1]+'hyaku']);p+=(p?' ':'')+x[0];pr+=(pr?' ':'')+x[1]}
 if(te){const x=te===1?['じゅう','juu']:[D[te][0]+'じゅう',D[te][1]+'juu'];p+=(p?' ':'')+x[0];pr+=(pr?' ':'')+x[1]}
 if(un){p+=(p?' ':'')+D[un][0];pr+=(pr?' ':'')+D[un][1]}
 if(p){k.push(p);r.push(pr)}
 return[k.join(' '),r.join(' ')]}

  st.innerHTML=meta(T('Собери фразу по-японски','Build the sentence in Japanese'))+`<div class="qru" style="font-size:22px;color:var(--ink);font-weight:800">${T(it[0][0],it[0][1])}</div>${dis?`<p class="small" style="text-align:center;margin-top:-8px">${T('одно слово лишнее','one word is extra')}</p>`:''}
  <div class="answer" data-ph="${T('нажимай на слова по порядку','tap the words in order')}">${chosen.map((i,n)=>`<button class="wt" data-a="${n}">${pool[i][0]}${rj(pool[i][1])}</button>`).join('')}</div>
  <div class="tiles">${pool.map((w,i)=>chosen.includes(i)?'':`<button class="wt" data-p="${i}">${w[0]}${rj(w[1])}</button>`).join('')}</div>
  <div class="fb ${msg?'show '+msg.c:''}">${msg?msg.t:''}</div>
  <div class="btns">${msg&&msg.c==='ok'?`<button class="btn" id="bNext">${T('Дальше','Next')} →</button>`:`<button class="btn ghost" id="bClr">${T('Сбросить','Reset')}</button><button class="btn" id="bChk">${T('Проверить','Check')}</button>${msg?`<button class="btn ghost" id="bShow">${T('Показать ответ','Show answer')}</button>`:''}`}</div>`;
  st.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.p);draw()});
  st.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.a,1);draw()});
  if($('#bNext'))$('#bNext').onclick=buildNext;
  if($('#bClr'))$('#bClr').onclick=()=>{chosen=[];draw()};
  if($('#bShow'))$('#bShow').onclick=()=>{chosen=ans.map(a=>pool.findIndex(p=>p[0]===a));draw({c:'no',t:`${T('Правильно так','The answer')}: <span class="jp"><b>${ans.join(' ')}</b></span>`})};
  if($('#bChk'))$('#bChk').onclick=()=>{const ch=chosen.map(i=>pool[i][0]);const ok=valid.some(v=>v.length===ch.length&&v.every((w,i)=>w===ch[i]));score.all++;if(ok)score.ok++;let t;
   if(ok)t=`<b>${T('Верно!','Correct!')}</b> <span class="jp">${ch.join(' ')}</span>`;
   else if(dis&&ch.includes(dis[0]))t=T(`<b>Почти.</b> Проверь «<span class="jp">${dis[0]}</span>»: здесь нужно другое.`,`<b>Almost.</b> Check “<span class="jp">${dis[0]}</span>”: something else is needed here.`);
   else if(ch[ch.length-1]!==ans[ans.length-1])t=T('<b>Подсказка:</b> глагол (или です) всегда стоит в самом конце.','<b>Hint:</b> the verb (or です) always comes last.');
   else if(ch.length<ans.length)t=T('<b>Не хватает слов.</b> Используй все, кроме лишнего.','<b>Some words are missing.</b> Use all of them except the extra one.');
   else t=T('<b>Порядок не тот.</b> Схема: кто は → когда → где / с кем → что を → глагол.','<b>Wrong order.</b> Pattern: who は → when → where / with whom → what を → verb.');
   draw({c:ok?'ok':'no',t})}}
 draw()}
function timeNext(){const h=1+Math.floor(Math.random()*12);let m=Math.random()<.15?30:(1+Math.floor(Math.random()*59));const useHan=m===30&&Math.random()<.5;
 const c=useHan?[HOURS[h][0]+' はん',HOURS[h][1]+' han']:timeRead(h,m);const set=new Map([[c[0],c]]);
 const add=x=>{if(x&&!set.has(x[0]))set.set(x[0],x)};
 if(BADH[h])add(timeRead(h,m,{badH:1}));add(timeRead(h,m,{badM:1}));
 while(set.size<4){const mm=Math.max(1,Math.min(59,m+pick([-10,-5,-3,-1,1,2,3,5,10,20])));add(Math.random()<.5?timeRead(h,mm):timeRead(h,mm,{badM:1}))}
 const opts=shuffle([...set.values()].slice(0,4));const u=m%10;
 mc({head:T('Как сказать это время?','How do you say this time?'),q:`<div class="clock">${h}:${String(m).padStart(2,'0')}</div>`,options:opts.map(o=>({v:o[0],html:`<span style="font-size:18px">${o[0]}</span><small>${o[1]}</small>`})),correct:c[0],
  explain:`<span class="jp"><b>${c[0]}</b></span> (${c[1]}). ${BADH[h]?`${h} ${T('часов','o’clock')} = <b>${HOURS[h][0]}</b>. `:''}${u===0?'':T(`Минуты на ${u} → <b>${[1,3,4,6,8].includes(u)?'ぷん':'ふん'}</b>.`,`Minutes ending in ${u} → <b>${[1,3,4,6,8].includes(u)?'ぷん':'ふん'}</b>.`)}${m===30?T(' 30 минут можно сказать はん.',' 30 minutes can also be はん.'):''}`,onNext:timeNext})}
function yenNext(){const n=pick([1,2,3,5,8,10,15,30,38,45,60,80,120,160,250,300,350,450,600,800,1000,1500,2800,3500,5895,8000,9000,10000,25000,34000].map(x=>x>=100?x:x*100));
 const c=yenRead(n);const set=new Map([[c[0],c]]);const add=x=>{if(!set.has(x[0]))set.set(x[0],x)};add(yenRead(n,true));
 let g=0;while(set.size<4&&g<40){g++;const d=pick([100,200,500,1000,2000,10000]);const nn=n+(Math.random()<.5?-d:d);if(nn>0)add(yenRead(nn))}
 mc({head:T('Как сказать цену?','How do you say this price?'),q:`<div class="clock">¥${fmt(n)}</div>`,options:shuffle([...set.values()].slice(0,4)).map(o=>({v:o[0],html:`<span style="font-size:17px">${o[0]}</span><small>${o[1]}</small>`})),correct:c[0],
  explain:`<span class="jp"><b>${c[0]}</b></span> (${c[1]}). ${T('Помни','Remember')}: 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく, 3000 さんぜん, 8000 はっせん, 10 000 いちまん.`,onNext:yenNext})}
let kqScript='h',kqYoon=false;
function kanaNext(){const pool=H_BASE.filter(Boolean).concat(H_DAK).concat(kqYoon?H_YOON:[]);const it=pick(pool),ro=x=>x[1].split(' ')[0];
 const others=shuffle(pool.filter(x=>ro(x)!==ro(it))).slice(0,3);const ch=kqScript==='k'||(kqScript==='mix'&&Math.random()<.5)?toKata(it[0]):it[0];
 const pre=`<div class="filters" style="justify-content:center"><button class="pill ${kqScript==='h'?'on':''}" data-ks="h">${T('хирагана','hiragana')}</button><button class="pill ${kqScript==='k'?'on':''}" data-ks="k">${T('катакана','katakana')}</button><button class="pill ${kqScript==='mix'?'on':''}" data-ks="mix">${T('вперемешку','mixed')}</button><label class="ck" style="margin-left:8px"><input type="checkbox" id="kqY" ${kqYoon?'checked':''}> ${T('с сочетаниями (きゃ…)','with combinations (きゃ…)')}</label></div>`;
 mc({pre,head:T('Как читается знак?','How is this read?'),q:`<span style="font-size:68px">${ch}</span>`,options:shuffle([it].concat(others)).map(x=>({v:ro(x),html:`<span style="font-family:Manrope,system-ui,sans-serif">${ro(x)}</span>`})),correct:ro(it),explain:`<span class="jp" style="font-size:20px">${ch}</span> = <b>${it[1]}</b>`,onNext:kanaNext});
 stage().querySelectorAll('[data-ks]').forEach(b=>b.onclick=()=>{kqScript=b.dataset.ks;kanaNext()});$('#kqY').onchange=e=>{kqYoon=e.target.checked;kanaNext()}}

/* ================= SECTIONS / RENDER ================= */
const SECS=[SEC_PHRASES,SEC_WORDS,SEC_NUMBERS,SEC_TIME,SEC_AGE,SEC_DATES,SEC_WEEK,SEC_GRAMMAR,SEC_KANA,SEC_TRICKY];
const SBY=Object.fromEntries(SECS.map(s=>[s.id,s]));
const NAV=[['home','Главная','Home']].concat(SECS.slice(0,8).map(s=>[s.id,s.t[0],s.t[1],s.n])).concat([['kana','Кана','Kana'],['tricky','Сложные места','Tricky bits'],['practice','Тренировка','Practice']]);
const THEMES=[['sakura','Сакура','Sakura',['#ff3d7f','#7b5cff']],['pop','Манга-поп','Manga pop',['#ff3b30','#1d5cff']],['neon','Токио ночью','Tokyo at night',['#ff2fa8','#22e1ff']],['matcha','Матча','Matcha',['#10a36d','#ff7a2f']]];
let theme=store.get('theme','sakura'),showRj=store.get('rj',true),showTr=store.get('ru',true);

function setHH(){const hd=$('header');document.documentElement.style.setProperty('--hh',(getComputedStyle(hd).position==='sticky'?hd.offsetHeight:0)+'px')}
function renderHeader(){document.documentElement.lang=LANG;document.title=T('Японский — мои уроки','Japanese — my lessons');
 $('#logo').innerHTML=`<span class="stamp">日本語</span> ${T('Мои уроки японского','My Japanese lessons')}`;
 $('#sw').innerHTML=THEMES.map(t=>`<button class="${t[0]===theme?'on':''}" data-th="${t[0]}" title="${T(t[1],t[2])}" aria-label="${T(t[1],t[2])}" style="background:linear-gradient(135deg,${t[3][0]},${t[3][1]})"></button>`).join('');
 $('#tgRj').textContent=T('ромадзи','romaji');$('#tgRj').title=T('Показывать латиницу (ромадзи)','Show romaji');
 $('#tgRu').textContent=T('перевод','translation');$('#tgRu').title=T('Показывать перевод','Show translation');
 $('#lang').innerHTML=`<button class="${LANG==='ru'?'on':''}" data-lang="ru">RU</button><button class="${LANG==='en'?'on':''}" data-lang="en">EN</button>`;
 $('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" data-t="${n[0]}">${n[3]?`<span class="n">${n[3]}</span>`:''}${T(n[1],n[2])}</a>`).join('');
 document.body.className=document.body.className.replace(/t-\w+/g,'').trim()+' t-'+theme;
 document.body.classList.toggle('norj',!showRj);document.body.classList.toggle('notr',!showTr);$('#tgRj').classList.toggle('on',showRj);$('#tgRu').classList.toggle('on',showTr);
 requestAnimationFrame(setHH)}

function renderHome(){const tiles=SECS.slice(0,8).map(s=>`<a class="tile" href="#${s.id}" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><div class="bk">${s.k}</div><div class="no">${String(s.n).padStart(2,'0')}</div><div class="tt">${T(s.t[0],s.t[1])}</div><div class="ts">${T(s.sub[0],s.sub[1])}</div></a>`).join('');
 const extra=[[SEC_KANA,'kana'],[SEC_TRICKY,'tricky'],[{k:'練',c:['#1e88e5','#2fd39a'],t:['Тренировка','Practice'],sub:['Частицы, глаголы, время, цены, кана.','Particles, verbs, time, prices, kana.']},'practice']].map(([s,id])=>`<a class="tile sm" href="#${id}" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><div class="bk">${s.k}</div><div class="tt" style="margin-top:0">${T(s.t[0],s.t[1])}</div><div class="ts">${T(s.sub[0],s.sub[1])}</div></a>`).join('');
 $('#home').innerHTML=`<div class="hero"><div class="big-kana">学</div><h1>こんにちは、ターニャ！</h1><p>${T('Всё из моих уроков в том же порядке, что в тетради: от фраз до грамматики. Выбери раздел, а внутри — тему.','Everything from my lessons in the same order as my notebook, from phrases to grammar. Pick a section, then a topic inside it.')}</p>
 <div class="stats"><div class="stat"><b>8</b>${T('разделов','sections')}</div><div class="stat"><b>${VOCAB.length}</b>${T('слов','words')}</div></div></div>
 <h3>${T('Разделы','Sections')}</h3><div class="tgrid">${tiles}</div>
 <h3>${T('Ещё','More')}</h3><div class="tgrid">${extra}</div><div style="height:18px"></div>${appLink()}`}

function renderSection(s,blockId){const i=SECS.indexOf(s),main=SECS.slice(0,8),mi=main.indexOf(s);
 const prev=mi>0?main[mi-1]:null,next=mi>=0&&mi<7?main[mi+1]:null;
 $('#sec').innerHTML=`<div class="banner" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><div class="bk" style="position:absolute;right:14px;top:0;font-size:90px;font-family:'Noto Sans JP';font-weight:900;opacity:.18">${s.k}</div>${s.n?`<div style="font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:26px;opacity:.9">${String(s.n).padStart(2,'0')}</div>`:''}<h2>${T(s.t[0],s.t[1])}</h2><p>${T(s.sub[0],s.sub[1])}</p></div>
 ${s.top?s.top():''}
 ${s.blocks.length>1?`<div class="subnav">${s.blocks.map(b=>`<a href="#${s.id}/${b.id}" data-b="${b.id}">${T(b.t[0],b.t[1])}</a>`).join('')}</div>`:''}
 ${s.blocks.map(b=>`<div class="blk" id="b-${b.id}"><h3>${T(b.t[0],b.t[1])}</h3>${b.h()}</div>`).join('')}
 <div class="pager">${prev?`<a href="#${prev.id}">← ${prev.n}. ${T(prev.t[0],prev.t[1])}</a>`:'<a href="#home">← '+T('Главная','Home')+'</a>'}${next?`<a href="#${next.id}">${next.n}. ${T(next.t[0],next.t[1])} →</a>`:''}</div>`;
 if(s.id==='words'){$('#q').oninput=renderFound}
 if(blockId){const el=document.getElementById('b-'+blockId);if(el){setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),30);markSub(blockId);return}}
 window.scrollTo(0,0)}
function markSub(id){document.querySelectorAll('.subnav a').forEach(a=>a.classList.toggle('on',a.dataset.b===id))}
function renderFound(){const q=$('#q').value.trim().toLowerCase();const box=$('#found');if(!q){box.innerHTML='';return}
 const list=VOCAB.filter(v=>v.k.includes(q)||toKata(v.k).includes(q)||v.r.toLowerCase().includes(q)||v.ru.toLowerCase().includes(q)||v.en.toLowerCase().includes(q));
 box.innerHTML=`<div class="small" style="margin-bottom:6px">${T('Найдено','Found')}: ${list.length}</div>`+(list.length?`<div class="card" style="padding:6px 14px"><table class="wtab">${list.map(w=>`<tr><td class="k">${w.k}${rj(w.r)}</td><td><b class="tr">${T(w.ru,w.en)}</b></td><td class="small"><a href="#words/${w.b.id}">${T(w.b.t[0],w.b.t[1])}</a></td></tr>`).join('')}</table></div>`:'')}

function renderPractice(){$('#practice').innerHTML=`<h2>${T('Тренировка','Practice')}</h2><p class="lead">${T('Выбери упражнение. Переключатели «ромадзи» и «перевод» вверху тоже работают: без ромадзи сложнее, зато быстрее привыкаешь к кане.','Pick an exercise. The “romaji” and “translation” toggles at the top work here too: without romaji it’s harder, but you get used to kana faster.')}</p>
 <div class="filters" id="prSwitch">${PMODES.map(p=>`<button class="pill" data-p="${p[0]}">${T(p[1],p[2])}</button>`).join('')}</div><div class="stage" id="stage"></div>
 <div style="height:18px"></div>${appLink()}`;
 $('#prSwitch').onclick=e=>{const b=e.target.closest('[data-p]');if(b)setMode(b.dataset.p)};setMode(mode)}

let curSec=null;
function route(){const h=decodeURIComponent(location.hash.slice(1))||'home';const [sid,bid]=h.split('/');let on='home';
 if(sid==='practice'){on='practice';if(curSec!=='practice')renderPractice();curSec='practice';window.scrollTo(0,0)}
 else if(SBY[sid]){on='sec';if(curSec!==sid||!bid){renderSection(SBY[sid],bid)}else{const el=document.getElementById('b-'+bid);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});markSub(bid)}}curSec=sid}
 else{renderHome();curSec='home';window.scrollTo(0,0)}
 document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('on',s.id===on));
 const navT=on==='home'?'home':sid;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===navT));
 const act=document.querySelector('nav a.on'),nv=$('#nav');if(act)nv.scrollLeft=act.offsetLeft-nv.clientWidth/2+act.offsetWidth/2}
function rerenderAll(){renderHeader();curSec=null;route()}

document.addEventListener('click',e=>{
 const th=e.target.closest('[data-th]');if(th){theme=th.dataset.th;store.set('theme',theme);renderHeader();return}
 const lg=e.target.closest('[data-lang]');if(lg){LANG=lg.dataset.lang;store.set('lang',LANG);rerenderAll();return}
 const k=e.target.closest('[data-k]');if(k){kScript=k.dataset.k;store.set('kscript',kScript);const y=window.scrollY;curSec=null;route();window.scrollTo(0,y);return}
 const sb=e.target.closest('.subnav a');if(sb&&location.hash==='#'+sb.getAttribute('href').slice(1)){e.preventDefault();const el=document.getElementById('b-'+sb.dataset.b);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});markSub(sb.dataset.b)}
});
$('#tgRj').onclick=()=>{showRj=!showRj;store.set('rj',showRj);renderHeader()};
$('#tgRu').onclick=()=>{showTr=!showTr;store.set('ru',showTr);renderHeader()};
window.addEventListener('hashchange',route);
window.addEventListener('resize',setHH);
renderHeader();route();
</script>
